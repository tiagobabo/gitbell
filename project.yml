name: GitBell
options:
  bundleIdPrefix: dev.tiagobabo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # No Apple developer team: sign to run locally.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    # Universal: Apple Silicon and Intel.
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  GitBellShared:
    type: framework
    platform: macOS
    sources: [Sources/GitBellShared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tiagobabo.GitBellShared
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES
  GitBell:
    type: application
    platform: macOS
    sources:
      - Sources/GitBell
      - path: Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tiagobabo.GitBell
        INFOPLIST_FILE: Resources/Info.plist
    dependencies:
      - target: GitBellShared
      - target: GitBellWidget
  GitBellWidget:
    type: app-extension
    platform: macOS
    sources: [Sources/GitBellWidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tiagobabo.GitBell.Widget
        INFOPLIST_FILE: Resources/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Widget.entitlements
    dependencies:
      - target: GitBellShared
        embed: false
